title: HVCMS Documentation
description: >- # ignore newlines until further settings
  Official documentation for HVCMS Rails app.

url: "https://hvcms.docs.hvboom.biz"

collections_dir: content
collections:
  usage:
    output: true
    permalink: /usage/:name.html
  development:
    output: true
    permalink: /development/:name.html
  chatgpt:
    output: true
    permalink: /chatgpt/:name.html

defaults:
  - scope:
      path: ""
      type: "chatgpt"
    values:
      full_width: false
      show_title: false
      show_tags: true
      aside:
        toc: true # Enable auto-generated table of contents
      sidebar:
        nav: "chatgpt"

